# Render blueprint for the API (Docker) + managed Postgres.
#
# The API is a stateful, long-running process: it owns an in-process reminder
# scheduler and two persistent pg pools. It is deliberately NOT deployed to a
# serverless platform. Railway and a plain Docker VPS work the same way from
# the same Dockerfile.
#
# IMPORTANT: numInstances must stay at 1. The reminder scheduler has no
# distributed lock, so multiple replicas would scan the same tenants
# concurrently. See DEPLOYMENT.md ("Scaling beyond one instance").

services:
  - type: web
    name: dentalcare-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Migration/superuser connection. Platform plane uses this too.
      - key: DATABASE_URL
        fromDatabase:
          name: dentalcare-db
          property: connectionString

      # Tenant plane. MUST point at the non-superuser app_user role created by
      # migration 0003, or the API refuses to boot in production. Set manually
      # after running migrations — Render cannot derive a non-owner role.
      - key: APP_DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d

      # Comma-separated; wildcards allowed for per-tenant subdomains.
      - key: CORS_ORIGINS
        sync: false

      - key: REMINDER_SCAN_INTERVAL_MS
        value: 60000

      # ALLOW_TENANT_HEADER is deliberately absent. It is ignored in
      # production regardless, and setting it would be misleading.

databases:
  - name: dentalcare-db
    plan: basic-256mb
    region: frankfurt
